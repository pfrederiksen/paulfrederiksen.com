<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paul Frederiksen — Photography</title>
    <meta name="description" content="Film photography by Paul Frederiksen. Desert landscapes and urban scenes from Las Vegas and beyond.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .hero img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 2px;
        }

        .name {
            margin-top: 2rem;
            font-size: 1.4rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .tagline {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            font-weight: 300;
            color: #888;
            letter-spacing: 0.05em;
        }

        .socials {
            display: flex;
            gap: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        .socials a {
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .socials a:hover {
            color: #fff;
        }

        @media (max-width: 600px) {
            .name {
                font-size: 1.1rem;
            }

            .socials {
                gap: 1.2rem;
                flex-wrap: wrap;
                justify-content: center;
            }

            .socials a {
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="photos/01-desert-highway.jpg" alt="Desert highway stretching toward distant mountains under open sky">
        <h1 class="name">Paul Frederiksen</h1>
        <p class="tagline">Film Photography</p>
        <nav class="socials">
            <a href="https://flickr.com/photos/paul-frederiksen/" target="_blank">Flickr</a>
            <a href="https://instagram.com/iamdesertpaul" target="_blank">Instagram</a>
            <a href="https://threads.net/@iamdesertpaul" target="_blank">Threads</a>
            <a href="https://x.com/iamdesertpaul" target="_blank">X</a>
        </nav>
    </div>
</body>
</html>
